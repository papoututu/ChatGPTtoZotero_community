<svg xmlns="http://www.w3.org/2000/svg" width="920" height="406" viewBox="0 0 920 406" role="img" aria-labelledby="title desc"><title id="title">Render: four settings to enter</title><desc id="desc">WRITE_ENABLED is a text field. Never share secret values.</desc><rect width="920" height="406" rx="16" fill="#f4f6fa"/><g font-family="Arial,sans-serif" fill="#19283d"><text x="30" y="40" font-size="23" font-weight="bold">Render: four settings to enter</text><text x="30" y="69" font-size="15">Diagram only — fictitious values, no personal data</text><rect x="25" y="90" width="870" height="52" rx="7" fill="white" stroke="#aeb8c8"/><text x="40" y="122" font-family="monospace" font-size="17">ZOTERO_USER_ID</text><text x="390" y="122" font-family="monospace" font-size="17">1234567 (example)</text><rect x="25" y="154" width="870" height="52" rx="7" fill="white" stroke="#aeb8c8"/><text x="40" y="186" font-family="monospace" font-size="17">ZOTERO_API_KEY</text><text x="390" y="186" font-family="monospace" font-size="17">•••••••• (your dedicated key)</text><rect x="25" y="218" width="870" height="52" rx="7" fill="white" stroke="#aeb8c8"/><text x="40" y="250" font-family="monospace" font-size="17">OWNER_PASSWORD</text><text x="390" y="250" font-family="monospace" font-size="17">•••••••• (20 characters min.)</text><rect x="25" y="282" width="870" height="52" rx="7" fill="white" stroke="#aeb8c8"/><text x="40" y="314" font-family="monospace" font-size="17">WRITE_ENABLED</text><text x="390" y="314" font-family="monospace" font-size="17">false → true after validation</text><text x="30" y="386" font-size="15">WRITE_ENABLED is a text field. Never share secret values.</text></g></svg>

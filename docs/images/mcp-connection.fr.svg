<svg xmlns="http://www.w3.org/2000/svg" width="920" height="406" viewBox="0 0 920 406" role="img" aria-labelledby="title desc"><title id="title">ChatGPT : connexion à ton serveur distant</title><desc id="desc">Chaque personne utilise sa propre URL. Le mode STDIO ne convient pas ici.</desc><rect width="920" height="406" rx="16" fill="#f4f6fa"/><g font-family="Arial,sans-serif" fill="#19283d"><text x="30" y="40" font-size="23" font-weight="bold">ChatGPT : connexion à ton serveur distant</text><text x="30" y="69" font-size="15">Exemple schématique — valeurs fictives, aucune donnée personnelle</text><rect x="25" y="90" width="870" height="52" rx="7" fill="white" stroke="#aeb8c8"/><text x="40" y="122" font-family="monospace" font-size="17">Type</text><text x="390" y="122" font-family="monospace" font-size="17">Diffusion HTTP en continu</text><rect x="25" y="154" width="870" height="52" rx="7" fill="white" stroke="#aeb8c8"/><text x="40" y="186" font-family="monospace" font-size="17">URL</text><text x="390" y="186" font-family="monospace" font-size="17">https://YOUR-SERVICE…/mcp</text><rect x="25" y="218" width="870" height="52" rx="7" fill="white" stroke="#aeb8c8"/><text x="40" y="250" font-family="monospace" font-size="17">Authentication / Authentification</text><text x="390" y="250" font-family="monospace" font-size="17">OAuth</text><rect x="25" y="282" width="870" height="52" rx="7" fill="white" stroke="#aeb8c8"/><text x="40" y="314" font-family="monospace" font-size="17">Client ID</text><text x="390" y="314" font-family="monospace" font-size="17">zotero-cloud-personal</text><text x="30" y="386" font-size="15">Chaque personne utilise sa propre URL. Le mode STDIO ne convient pas ici.</text></g></svg>

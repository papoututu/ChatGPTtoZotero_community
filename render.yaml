services:
  - type: web
    name: zotero-cloud-mcp
    runtime: node
    plan: free
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run check
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: ZOTERO_USER_ID
        sync: false
      - key: ZOTERO_API_KEY
        sync: false
      - key: AUTH_SIGNING_SECRET
        generateValue: true
      - key: OWNER_PASSWORD
        sync: false
      - key: WRITE_ENABLED
        sync: false
